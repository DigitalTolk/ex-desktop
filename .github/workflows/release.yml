name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: ''
            rust_targets: ''
            asset_name_pattern: ''
          - os: macos-latest
            platform: macos-arm
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            asset_name_pattern: '[name]_[version]_arm64[ext]'
          - os: macos-13
            platform: macos-intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            asset_name_pattern: '[name]_[version]_x64[ext]'
          - os: macos-latest
            platform: macos-universal
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset_name_pattern: '[name]_[version]_universal[ext]'
          - os: windows-latest
            platform: windows
            args: ''
            rust_targets: ''
            asset_name_pattern: ''

    runs-on: ${{ matrix.os }}
    name: Release (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import json, sys
          path = 'src-tauri/tauri.conf.json'
          with open(path) as f: conf = json.load(f)
          conf['version'] = sys.argv[1]
          with open(path, 'w') as f: json.dump(conf, f, indent=2)
          print('Version set to', sys.argv[1])
          " "$VERSION"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: tauri
          args: >-
            ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          releaseAssetNamePattern: ${{ matrix.asset_name_pattern }}
          tagName: ${{ github.ref_name }}
          releaseName: 'ex Desktop ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
