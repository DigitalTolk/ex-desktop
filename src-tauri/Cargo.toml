[package]
name = "ex-desktop"
version = "0.1.0"
description = "ex — desktop client"
authors = ["DigitalTolk"]
license = "MIT"
repository = "https://github.com/DigitalTolk/ex-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-log  = "2"
keyring           = "4"

# Server config persistence
tauri-plugin-store = "2"

# Auto-updater
tauri-plugin-updater = "2"

# Window state (remember size/position)
tauri-plugin-window-state = "2"

# Deep links + single-instance enforcement
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

# Utilities
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
log        = "0.4"
tokio      = { version = "1", features = ["full", "time"] }
tauri-plugin-global-shortcut = "2.3.1"
url = "2"
