[package]
name = "ex-desktop"
version = "0.1.0"
description = "ex — desktop client"
authors = ["DigitalTolk"]
license = "MIT"
repository = "https://github.com/DigitalTolk/ex-desktop"
edition = "2021"
rust-version = "1.95.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri             = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log  = "2.8.0"
# Server config persistence
tauri-plugin-store = "2.4.3"

# Auto-updater
tauri-plugin-updater = "2.10.1"

# Window state (remember size/position)
tauri-plugin-window-state = "2.4.1"

# Deep links + single-instance enforcement
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"

# Utilities
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log        = "0.4.29"
tokio      = { version = "1.52.1", features = ["full", "time"] }
tauri-plugin-global-shortcut = "2.3.1"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
